pluginGroup = com.roychemo.cma
pluginVersion = 0.1.0

# The oldest IDE line the plugin supports is 2025.2 (build 252). It is compiled against that line, so it
# cannot call an API that 2025.2 does not have.
pluginSinceBuild = 252
platformVersion = 2025.2.6.3

# Paid listing (OFF). When true, the build adds <product-descriptor> to plugin.xml and the plugin starts asking
# JetBrains' LicensingFacade about Pro features. Leave it false until JetBrains has approved the paid listing and
# chosen the real product code; a descriptor with a placeholder code would lock Pro features for every user.
cmaPaid = false
cmaProductCode = PCLAUDEMULTI
cmaReleaseDate = 20261101
cmaReleaseVersion = 20261

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true
